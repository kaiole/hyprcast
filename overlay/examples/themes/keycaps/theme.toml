[theme]
id = "keycaps"
name = "Keycaps"
api_version = 1
entry = "Main.qml"

[options.font_size]
description = "Label size in logical pixels."
type = "integer"
default = 19
minimum = 1
maximum = 256

[options.height]
description = "Cap height in logical pixels."
type = "integer"
default = 40
minimum = 1
maximum = 512

[options.padding_x]
description = "Horizontal padding inside each cap, in logical pixels."
type = "integer"
default = 12
minimum = 0
maximum = 512

[options.radius]
description = "Cap corner radius in logical pixels."
type = "integer"
default = 7
minimum = 0
maximum = 256

[options.spacing]
description = "Gap between history entries, in logical pixels."
type = "integer"
default = 6
minimum = 0
maximum = 128

[options.inner_spacing]
description = "Gap between caps within a shortcut chord, in logical pixels."
type = "integer"
default = 3
minimum = 0
maximum = 128

[options.text_background]
description = "Fill for printable-text caps."
type = "color"
default = "#191919"

[options.key_background]
description = "Fill for special-key and modifier caps."
type = "color"
default = "#2a2a2a"

[options.border_color]
description = "Cap outline color."
type = "color"
default = "#444444"

[options.border_width]
description = "Cap outline thickness in logical pixels; zero hides it."
type = "integer"
default = 1
minimum = 0
maximum = 64

[options.text_color]
description = "Cap label color."
type = "color"
default = "#cccccc"
