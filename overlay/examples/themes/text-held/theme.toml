[theme]
id = "text-held"
name = "Ribbon with live modifiers"
api_version = 1
entry = "Main.qml"

[options.height]
type = "integer"
default = 48
minimum = 1
maximum = 512
description = "Preferred cap height for both stable bands."

[options.font_size]
type = "integer"
default = 24
minimum = 1
maximum = 256
description = "Label size; bounded by available cap height."

[options.padding_x]
type = "integer"
default = 16
minimum = 0
maximum = 512
description = "Cap horizontal padding; bounded by half cap height."

[options.radius]
type = "integer"
default = 7
minimum = 0
maximum = 256
description = "Cap radius; clamped to geometry."

[options.edge_depth]
type = "integer"
default = 3
minimum = 0
maximum = 24
description = "Lower lip inside cap height; zero gives flat caps."

[options.edge_color]
type = "color"
default = "#101010"
description = "Lower lip color."

[options.border_width]
type = "integer"
default = 1
minimum = 0
maximum = 64
description = "Cap outline thickness; clamped to geometry."

[options.border_color]
type = "color"
default = "#444444"
description = "Cap outline color."

[options.text_color]
type = "color"
default = "#cccccc"
description = "Cap label and repeat-count color."

[options.text_background]
type = "color"
default = "#191919"
description = "Printable action face color."

[options.key_background]
type = "color"
default = "#2a2a2a"
description = "Special key and modifier face color."

[options.inner_spacing]
type = "integer"
default = 3
minimum = 0
maximum = 128
description = "Spacing between caps in a chord."

[options.visible_groups]
type = "integer"
default = 12
minimum = 1
maximum = 12
description = "Maximum tail groups; available width may hide more."

[options.group_spacing]
type = "integer"
default = 8
minimum = 0
maximum = 48
description = "Gap between fitted ribbon groups."

[options.motion]
type = "enum"
default = "full"
values = ["full", "reduced"]
description = "Reduced disables ribbon transitions and pressed face travel; snapshot lifetime is unchanged."

[options.transition_ms]
type = "integer"
default = 180
minimum = 0
maximum = 600
description = "Ribbon transition duration; zero disables ribbon animation only. Dock press animation stays at 90 ms unless motion is reduced."

[options.show_held_keys]
type = "boolean"
default = true
description = "Show fixed modifier dock; its band remains reserved when hidden."

[options.show_altgr]
type = "boolean"
default = false
description = "Add a fifth canonical AltGr slot; never merge AltGr into Alt."

[options.dock_alignment]
type = "enum"
default = "center"
values = ["left", "center", "right"]
description = "Alignment of the fixed dock."

[options.dock_spacing]
type = "integer"
default = 6
minimum = 0
maximum = 128
description = "Modifier slot spacing; bounded on narrow surfaces."

[options.dock_idle_opacity]
type = "number"
default = 0.45
minimum = 0.1
maximum = 1.0
description = "Idle placeholder opacity, not proof of physical release."

[options.dock_active_background]
type = "color"
default = "#444444"
description = "Observed held modifier face color."

[options.row_gap]
type = "integer"
default = 12
minimum = 0
maximum = 64
description = "Fixed gap separating history and live state."

[options.inner_padding]
type = "integer"
default = 10
minimum = 0
maximum = 64
description = "Vertical panel inset; horizontal inset uses shared history padding."
